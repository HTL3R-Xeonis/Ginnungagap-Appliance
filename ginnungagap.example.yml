# Ginnungagap appliance - the ONE configuration file.
#
# Copy it to ginnungagap.yml (git-ignored, keep it readable by root only: it holds API keys) and run
#   python -m ginnungagap validate ginnungagap.yml
#   python -m ginnungagap render ginnungagap.yml
# Hosts (an ESXi host and its GNS3 VM) are NOT configured here: they are profiles you create in the app.

version: 1

appliance:
  public_url: http://localhost          # the address people use; https:// when tls.mode is self-signed
  timezone: Europe/Vienna
  tls: { mode: off }                    # off | self-signed
  auth: { mode: none }                  # none | basic (user + a bcrypt password_hash from `caddy hash-password`)
  legacy_ports: false                   # true: also publish 8123, 8000, 8001, 8002 as the services had before
  http_port: 80
  https_port: 443

services:                               # every service is its own container and can run alone
  template_esxi: true
  template_gns3: true
  generator: true
  ova_store: true                       # true: this appliance serves the store's OVAs to the ESXi hosts (templates.ova_port) | false: served elsewhere, set templates.ova_base_url
  filebrowser: false                    # not available yet

templates:                              # where the OVAs and their *.yml descriptions live
  store:
    type: local                         # local | nfs
    manage: false                       # enable admin import/edit on a writable store
    local: { path: /srv/templates }
    # nfs: { server: 10.20.20.180, export: /mnt/pool/templates }
  esxi_refresh_minutes: 15
  gns3_refresh_minutes: 5
  ova_port: 8088                        # plain HTTP, no login: only the ESXi hosts of the lab network may reach it
  # ova_base_url: http://10.20.20.181:8088  # the address the ESXi hosts pull <folder>/<file>.ova from; default: the public_url's host on ova_port
  # esxi_url: http://10.20.20.171:8000  # only needed when services.template_esxi is false
  # gns3_url: http://10.20.20.171:8001  # only needed when services.template_gns3 is false

generator:
  # url: http://10.20.20.172:8002       # only needed when services.generator is false
  llm_servers:                          # external Ollama servers, tried in order
    - { name: ollama-1, url: "http://10.20.20.81:11434", model: "granite4.1:8b" }
    - { name: ollama-2, url: "http://10.20.20.85:11434", model: "granite4.1:8b" }
  hosted:                               # optional hosted LLM services; the key is written only into a file only root reads
    # gemini: { api_key: "..." }        # presets: gemini, groq, openrouter (others need base_url and model)
  max_retries: 3
  request_timeout_seconds: 500

logging:
  level: INFO
  max_lines: 100000

update:                                 # `ginnungagap update`: new versions of the installed components (see the README)
  source: github                        # github: the public releases of `repo` (no login, no token needed) | directory: a folder with the files of ONE release
  repo: HTL3R-Xeonis/Ginnungagap-Appliance
  # directory: /srv/templates/ginnungagap-releases/v1.3.0   # only for source: directory (also the default of --offline-dir); needs an absolute path
  channel: stable                       # stable | prerelease (release candidates, vX.Y.Z-rc.N)
  # token_file: /etc/ginnungagap/update-token   # OPTIONAL access token (only for a private repo or the rate limit); the file is written by `ginnungagap update --set-token`, never put a token in this file
  check: off                            # off | daily (a timer that only LOOKS for a new version and never installs one)
  require_signature: auto               # auto: enforced as soon as /etc/ginnungagap/update-trust/allowed_signers exists | true | false
  keep_releases: 2                      # unpacked versions kept per component (2 = current + previous, what a rollback needs)
  step_timeout_seconds: 90              # how long each restarted service gets to become healthy
