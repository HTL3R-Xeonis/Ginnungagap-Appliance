# Every service is its own container with its own image, its own rendered configuration, its own health check and its
# own profile. There is deliberately no depends_on anywhere: a service only knows the others by the URLs it is given, so
# each one can be started and tested alone, e.g.
#   docker compose --env-file rendered/compose.env up -d --build template-esxi
# Which services run together is decided by COMPOSE_PROFILES in rendered/compose.env (written by `ginnungagap render`).

name: ginnungagap

# 10 s, not 30 s: an update waits for the first healthy answer of every restarted service, and a check only runs once per interval
# (three failed checks in a row still take 30 s to mark a service unhealthy, so a short hiccup is not reported)
# the images carry the repository they come from: GitHub links a package of the registry to it by this label (access and visibility
# are then those of the repository) - see release/build_images.py
x-image-labels: &image-labels
  org.opencontainers.image.source: https://github.com/HTL3R-Xeonis/Ginnungagap-Appliance

x-healthcheck-python: &probe
  interval: 10s
  timeout: 5s
  retries: 3
  start_period: 20s

services:
  gateway:
    profiles: [gateway]
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./rendered/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

  ginnungagap:
    profiles: [ginnungagap]
    build:
      context: .
      labels: *image-labels
      dockerfile: docker/operator.Dockerfile
      additional_contexts:
        operator: ${REPOS_DIR:-..}/Igdrasyl
        builder: ${REPOS_DIR:-..}/TopologyBuilder
    restart: unless-stopped
    env_file: [rendered/operator.env]
    volumes:
      - data:/data
      # the update button of Igdrasyl's admin panel (Updates), see ginnungagap/update_request.py. The update state is read-only
      # (what is installed, what the last check found, how a running update is doing); the request folder is the one place
      # the app may write to - one small request file that the host's own ginnungagap-update-request.path unit validates and
      # acts on. No Docker socket, no root on the host: the update itself runs on the host.
      - ${GINNUNGAGAP_UPDATE_DIR:-/var/lib/ginnungagap/update}:/update-state:ro
      - ${GINNUNGAGAP_UPDATE_REQUEST_DIR:-/var/lib/ginnungagap/update-requests}:/update-requests
    healthcheck:
      <<: *probe
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8123/health', timeout=4)"]

  template-esxi:
    profiles: [template-esxi]
    build:
      context: ${REPOS_DIR:-..}/Hugyn-and-Munyn/yaml-api
      labels: *image-labels
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      DATA_DIR: /data
      TEMPLATE_STORE_DIR: /store
    volumes:
      - template-data:/data:ro
      - template-store:/store:ro
    healthcheck:
      <<: *probe
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]

  collector-esxi:
    profiles: [collector-esxi]
    build:
      context: .
      labels: *image-labels
      dockerfile: docker/collector-esxi.Dockerfile
      additional_contexts:
        services: ${REPOS_DIR:-..}/Hugyn-and-Munyn
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      TEMPLATE_STORE_DIR: /store
      TEMPLATES_OUTPUT_FILE: /data/templates.yml
      TEMPLATES_LOG_FILE: /data/collect.log
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REFRESH_SECONDS: ${ESXI_REFRESH_SECONDS:-900}
    volumes:
      - template-data:/data
      - template-store:/store:ro

  template-gns3:
    profiles: [template-gns3]
    build:
      context: ${REPOS_DIR:-..}/Hugyn-and-Munyn/gns3-template-api
      labels: *image-labels
      dockerfile: gns3_api.Dockerfile
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      DATA_DIR: /data
    volumes:
      - template-data:/data:ro
    healthcheck:
      <<: *probe
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]

  collector-gns3:
    profiles: [collector-gns3]
    build:
      context: .
      labels: *image-labels
      dockerfile: docker/collector-gns3.Dockerfile
      additional_contexts:
        services: ${REPOS_DIR:-..}/Hugyn-and-Munyn
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      REFRESH_SECONDS: ${GNS3_REFRESH_SECONDS:-300}
    volumes:
      - template-data:/data
      - data:/host-data:ro
      - ./rendered/collector-gns3:/config:ro

  generator:
    profiles: [generator]
    build:
      context: ${REPOS_DIR:-..}/Mimyr
      labels: *image-labels
      dockerfile: topology.Dockerfile
    restart: unless-stopped
    env_file:
      - path: rendered/generator.env
        required: false
    environment:
      TZ: ${TZ:-UTC}
      CONFIG_PATH: /config/topology_config.yml
    volumes:
      - ./rendered/generator:/config:ro
    healthcheck:
      <<: *probe
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]

  # Serves the OVA files of the template store to the ESXi hosts, which pull them themselves (Mjonyr only reads the
  # descriptor and starts the pull). Plain HTTP, read-only, *.ova only, no login (an ESXi host cannot send one): the
  # published port must only be reachable from the lab network. Its Caddyfile is rendered, see ginnungagap/render.py.
  ova-store:
    profiles: [ova-store]
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${OVA_PORT:-8088}:80"
    volumes:
      - ./rendered/ova-store/Caddyfile:/etc/caddy/Caddyfile:ro
      - template-store:/store:ro
    healthcheck:
      <<: *probe
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/health"]

  setup:
    profiles: [setup]
    build:
      context: .
      labels: *image-labels
      dockerfile: docker/setup.Dockerfile
      additional_contexts:
        caddy: "docker-image://caddy:2"  # only for its `caddy hash-password`, see docker/setup.Dockerfile
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      # read-only: only to show that a configuration already exists, never to write it (see ginnungagap/setup_wizard.py)
      - ${GINNUNGAGAP_CONFIG_DIR:-/etc/ginnungagap}:/etc/ginnungagap:ro
      # the only writable path this container has anywhere: a submitted configuration and its "apply me" marker, read by
      # the host's own ginnungagap-setup-apply.path/.service (install.sh), never by another container
      - ${GINNUNGAGAP_SETUP_STAGING_DIR:-/var/lib/ginnungagap/setup}:/staging
    healthcheck:
      <<: *probe
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]

volumes:
  data: {}
  template-data: {}
  caddy-data: {}
  # Local/NFS store. Readers have read-only mounts. Admin management can enable a writable mount.
  template-store:
    driver: local
    driver_opts:
      type: ${TEMPLATE_STORE_VOLUME_TYPE:-none}
      o: ${TEMPLATE_STORE_VOLUME_OPTS:-bind,ro}
      device: ${TEMPLATE_STORE_VOLUME_DEVICE:-/srv/templates}
