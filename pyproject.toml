[project]
name = "ginnungagap-appliance"
version = "0.1.0"
description = "One config file and one compose project for the Ginnungagap services."
requires-python = ">=3.12"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
# Only the program is a package; image/, release/, schema/, smoke/ and docker/ are tooling folders, and automatic
# discovery refuses a flat layout with several top-level folders.
packages = ["ginnungagap"]
