name: Python CI (Ruff & Tests)

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  tests_and_linter:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # PyYAML is the only runtime dependency; the tests need no Docker and no network
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      # TESTS
      - name: Execute tests with pytest
        run: pytest

      # LINTER
      - name: Install ruff
        run: pip install ruff

      - name: Ruff Check
        run: ruff check --output-format=github .

      - name: Ruff Format
        run: ruff format --output-format=github --diff --check .
