# Builds the release of the whole appliance: components.json, SHA256SUMS, the tarballs of the five components (and, when the
# signing key is set, components.json.sig) - and publishes them as a GitHub release of THIS repository.
#
# It runs on a pushed tag v* (nothing runs before somebody pushes one) or by hand with "dry_run" (the default): a dry run
# builds the same files and keeps them as a workflow artifact, and creates NO release and NO tag.
#
# Secrets (both optional, the repositories are public):
#   COMPONENTS_READ_TOKEN  a token that may read the other repositories' releases (anonymous access has a lower rate limit)
#   RELEASE_SIGNING_KEY    the private SSH key (no passphrase) that signs components.json; without it the release is unsigned
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "The release to build, like v1.3.0 or v1.3.0-rc.1 (it has to match release/components.in.yml)"
        required: true
        type: string
      dry_run:
        description: "Only build and keep the files as an artifact; publish nothing"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # a release is created only when the run is not a dry run
    env:
      PYTHON_VERSION: "3.12"
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      GH_TOKEN: ${{ github.token }}
      COMPONENTS_READ_TOKEN: ${{ secrets.COMPONENTS_READ_TOKEN }}
      RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # git archive needs the tag and its commit

      - name: Check the tag
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::the tag '$TAG' is not like v1.3.0 or v1.3.0-rc.1"; exit 1 ;;
          esac
          if [ "$DRY_RUN" != "true" ] && ! git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "::error::the tag $TAG does not exist in this repository: push it first, a release is never made from a branch"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "PyYAML>=6" "pytest>=8" ruff

      # the same gate as ci.yml: a release is never built from a state whose tests or style checks fail
      - name: Tests and style checks
        run: |
          pytest
          ruff check .
          ruff format --check .

      - name: Say what is missing
        run: |
          if [ -z "$COMPONENTS_READ_TOKEN" ]; then
            echo "::notice::secret COMPONENTS_READ_TOKEN is not set: the other repositories' releases are read anonymously (fine while they are public)"
          fi
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::warning::secret RELEASE_SIGNING_KEY is not set: components.json will NOT be signed"
          fi

      - name: Build the release files
        run: |
          set -eu
          trap 'rm -f "$RUNNER_TEMP/release_key"' EXIT
          args=(--pins release/components.in.yml --out dist/release --fetch --tag "$TAG" --notes-file dist/notes.md)
          if [ "$DRY_RUN" = "true" ]; then args+=(--ref HEAD); else args+=(--ref "refs/tags/$TAG"); fi
          if [ -n "$RELEASE_SIGNING_KEY" ]; then
            umask 077
            printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release_key"
            args+=(--sign "$RUNNER_TEMP/release_key")
          fi
          # the manifest of the latest stable release, for the "1.2.1 -> 1.3.0" lines of the release notes (there may be none)
          mkdir -p dist/previous
          if gh release download --pattern components.json --dir dist/previous 2>/dev/null; then
            args+=(--previous dist/previous/components.json)
          fi
          python release/build_release.py "${args[@]}"

      - name: Check what was built
        run: python release/build_release.py --verify dist/release

      - name: Keep the files of a dry run
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: release-${{ env.TAG }}
          path: |
            dist/release/*
            dist/notes.md
          if-no-files-found: error

      - name: Publish the release
        if: env.DRY_RUN != 'true'
        run: |
          set -eu
          extra=()
          case "$TAG" in *-*) extra+=(--prerelease) ;; esac
          gh release create "$TAG" dist/release/* \
            --verify-tag \
            --title "Ginnungagap appliance ${TAG#v}" \
            --notes-file dist/notes.md \
            "${extra[@]}"
