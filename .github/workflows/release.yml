# Builds the release of the whole appliance: components.json, SHA256SUMS, the tarballs of the five components (and, when the
# signing key is set, components.json.sig) - and publishes them as a GitHub release of THIS repository.
#
# It also builds the service images of the release and pushes them to the GitHub container registry
# (ghcr.io/htl3r-xeonis/ginnungagap-<service>:<version>); components.json lists them BY DIGEST (`images`), so an appliance that
# updates pulls them instead of building them (update stage 2). A dry run builds the images but pushes nothing.
#
# It runs on a pushed tag v* (nothing runs before somebody pushes one) or by hand with "dry_run" (the default): a dry run
# builds the same files and keeps them as a workflow artifact, and creates NO release and NO tag.
#
# Secrets (both optional, the repositories are public):
#   COMPONENTS_READ_TOKEN  optional: a token that may read the other repositories' releases (default: the workflow's own token, enough while they are public)
#   RELEASE_SIGNING_KEY    the private SSH key (no passphrase) that signs components.json; without it the release is unsigned
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "The release to build, like v1.3.0 or v1.3.0-rc.1 (it has to match release/components.in.yml)"
        required: true
        type: string
      dry_run:
        description: "Only build and keep the files as an artifact; publish nothing"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # a release is created only when the run is not a dry run
      packages: write # the service images are pushed to ghcr.io only when the run is not a dry run
    env:
      PYTHON_VERSION: "3.12"
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      GH_TOKEN: ${{ github.token }}
      # the workflow's own token reads the PUBLIC component repositories' releases with the authenticated rate limit; an anonymous
      # request from a shared runner address is over the 60 requests per hour limit almost always (seen on the first tag run)
      COMPONENTS_READ_TOKEN: ${{ secrets.COMPONENTS_READ_TOKEN || github.token }}
      RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # git archive needs the tag and its commit

      - name: Check the tag
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::the tag '$TAG' is not like v1.3.0 or v1.3.0-rc.1"; exit 1 ;;
          esac
          if [ "$DRY_RUN" != "true" ] && ! git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "::error::the tag $TAG does not exist in this repository: push it first, a release is never made from a branch"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "PyYAML>=6" "pytest>=8" ruff

      # the same gate as ci.yml: a release is never built from a state whose tests or style checks fail
      - name: Tests and style checks
        run: |
          pytest
          ruff check .
          ruff format --check .

      - name: Say what is missing
        run: |
          if [ "$COMPONENTS_READ_TOKEN" = "$GH_TOKEN" ]; then
            echo "::notice::secret COMPONENTS_READ_TOKEN is not set: the other repositories' releases are read with this workflow's own token (fine while they are public)"
          fi
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::warning::secret RELEASE_SIGNING_KEY is not set: components.json will NOT be signed"
          fi

      # Pass 1: the five tarballs (the components' own releases, the appliance's git archive). The images are built from them, so
      # what a release contains is what its images were built from.
      - name: Fetch the component tarballs
        run: |
          set -eu
          args=(--pins release/components.in.yml --out dist/pass1 --fetch --tag "$TAG")
          if [ "$DRY_RUN" = "true" ]; then args+=(--ref HEAD); else args+=(--ref "refs/tags/$TAG"); fi
          python release/build_release.py "${args[@]}"

      - name: Unpack the components for the image build
        run: |
          set -eu
          mkdir -p repos
          for archive in dist/pass1/*.tar.gz; do
            name="$(basename "$archive")"
            case "$name" in
              Ginnungagap-Appliance-*) continue ;; # the appliance itself is this checkout
            esac
            folder="${name%-[0-9]*.tar.gz}"
            mkdir -p "repos/$folder"
            tar -xzf "$archive" -C "repos/$folder" --strip-components=1
          done
          ls repos

      - name: Log in to the container registry
        if: env.DRY_RUN != 'true'
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build the service images (and push them, unless it is a dry run)
        run: |
          set -eu
          push=()
          if [ "$DRY_RUN" != "true" ]; then push+=(--push); fi
          python release/build_images.py --repos-dir repos --version "${TAG#v}" "${push[@]}" --out dist/images.json
          cat dist/images.json

      # Pass 2: the release files with the images in components.json, signed
      - name: Build the release files
        run: |
          set -eu
          trap 'rm -f "$RUNNER_TEMP/release_key"' EXIT
          args=(--pins release/components.in.yml --out dist/release --sources dist/pass1 --images dist/images.json --tag "$TAG" --notes-file dist/notes.md)
          if [ -n "$RELEASE_SIGNING_KEY" ]; then
            umask 077
            printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release_key"
            args+=(--sign "$RUNNER_TEMP/release_key")
          fi
          # the manifest of the latest stable release, for the "1.2.1 -> 1.3.0" lines of the release notes (there may be none)
          mkdir -p dist/previous
          if gh release download --pattern components.json --dir dist/previous 2>/dev/null; then
            args+=(--previous dist/previous/components.json)
          fi
          python release/build_release.py "${args[@]}"

      - name: Check what was built
        run: python release/build_release.py --verify dist/release

      - name: Keep the files of a dry run
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ env.TAG }}
          path: |
            dist/release/*
            dist/notes.md
          if-no-files-found: error

      - name: Publish the release
        if: env.DRY_RUN != 'true'
        run: |
          set -eu
          extra=()
          case "$TAG" in *-*) extra+=(--prerelease) ;; esac
          gh release create "$TAG" dist/release/* \
            --verify-tag \
            --title "Ginnungagap appliance ${TAG#v}" \
            --notes-file dist/notes.md \
            "${extra[@]}"
